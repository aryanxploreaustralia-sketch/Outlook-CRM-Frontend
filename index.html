<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- `?v=2` busts the cached purple mark browsers already hold for this origin. -->
  <link rel="icon" type="image/svg+xml" href="/xplore-logo-mark.svg?v=2" />
  <!-- iOS home screen and any client without SVG icon support: the official PNG. -->
  <link rel="apple-touch-icon" href="/xplore-logo-mark.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Xplore Australia CRM — travel enquiry management and email automation." />
  <meta name="application-name" content="Xplore Australia CRM" />
  <meta name="apple-mobile-web-app-title" content="Xplore Australia CRM" />
  <meta name="theme-color" content="#2563eb" />
  <!-- Installability. `theme_color` in the manifest matches the meta above, so
       the title bar of the installed window and the browser agree. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Xplore Australia CRM</title>
</head>

<body>
  <div id="root"></div>
  <noscript>
    This application requires JavaScript to run. Please enable it in your browser settings.
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
